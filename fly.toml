app = "gaijin-scalping"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"

[mounts]
  source = "gaijin_bot_data"
  destination = "/app/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
